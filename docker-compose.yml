services:
  v1:
    build: ./app/v1
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  v2:
    build: ./app/v2
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    environment:
      PORT: "80"
      V1_HOST: "v1:3001"
      V2_HOST: "v2:3002"
      PROXY_SCHEME: "http"
      NGINX_ENVSUBST_FILTER: "PORT|V1_HOST|V2_HOST|PROXY_SCHEME"
    depends_on:
      v1:
        condition: service_healthy
      v2:
        condition: service_healthy