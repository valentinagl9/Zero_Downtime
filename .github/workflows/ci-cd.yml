name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t v1 ./app/v1
          docker build -t v2 ./app/v2
          docker build -t nginx ./nginx
